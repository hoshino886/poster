<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>鬼针草 · 9 张</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0b0d14;color:#e8ecf5;
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    padding-bottom:14vw;
    background-image:radial-gradient(80% 40% at 50% -5%, rgba(90,140,255,.16), transparent 70%);
    background-repeat:no-repeat;
  }
  body.locked{overflow:hidden}

  .back{
    display:inline-flex;align-items:center;gap:2vw;
    position:absolute;top:5vw;left:5vw;z-index:10;
    padding:2.4vw 4.4vw;border-radius:99px;
    font-size:3.2vw;letter-spacing:.14em;text-decoration:none;color:#cfe0ff;
    background:rgba(15,22,38,.6);border:1px solid rgba(150,190,255,.22);
    backdrop-filter:blur(8px);
  }

  header{padding:11vw 6vw 8vw;text-align:center}
  .dotline{
    display:inline-flex;align-items:center;gap:2.2vw;
    font-size:3vw;letter-spacing:.32em;color:#6f7ea8;text-transform:uppercase;
    margin-bottom:5vw;
  }
  .dot{width:2vw;height:2vw;border-radius:50%;background:#6fd6ff;box-shadow:0 0 6vw rgba(111,214,255,.9);animation:pulse 2.2s infinite}
  @keyframes pulse{50%{opacity:.3}}
  h1{font-size:9.4vw;line-height:1.2;font-weight:800}
  h1 .hl{background:linear-gradient(180deg,#cdeeff,#63bbff 60%,#3d8ef0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:4vw;font-size:3.4vw;letter-spacing:.3em;color:#77839f;text-transform:uppercase}
  .count{margin-top:6vw;display:inline-block;font-size:3vw;letter-spacing:.22em;color:#8b97b8;border:1px solid rgba(140,170,230,.25);padding:2vw 5vw;border-radius:99px}

  .grid{column-count:2;column-gap:3.4vw;padding:0 4vw}
  figure{
    break-inside:avoid;margin:0 0 3.4vw;border-radius:3vw;overflow:hidden;
    background:#151b28;box-shadow:0 .8vw 4vw rgba(0,0,0,.45);position:relative;
    cursor:zoom-in;
  }
  figure img{display:block;width:100%;height:auto}
  figure::after{
    content:attr(data-n);position:absolute;right:2.6vw;bottom:2.4vw;
    font-size:2.8vw;letter-spacing:.14em;color:rgba(255,255,255,.72);
    text-shadow:0 .4vw 2vw rgba(0,0,0,.8);
  }

  footer{margin-top:10vw;text-align:center;font-size:2.9vw;letter-spacing:.26em;color:#4f5872}

  /* 灯箱 */
  #lb{position:fixed;inset:0;z-index:50;display:none;background:rgba(4,6,12,.96)}
  #lb.on{display:block}
  #lb .stage{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:5vw;
  }
  #lb img{
    max-width:100%;max-height:82vh;border-radius:2.5vw;
    box-shadow:0 2vw 12vw rgba(0,0,0,.85);
    animation:pop .2s ease;
    touch-action:pan-y;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0}}

  #lb .close{
    position:absolute;top:4vw;right:4vw;z-index:3;
    width:11vw;height:11vw;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:6.5vw;line-height:1;color:#e7efff;
    border:1px solid rgba(180,210,255,.22);
    background:rgba(18,26,44,.6);backdrop-filter:blur(8px);
    cursor:pointer;
  }
  #lb .close:active{background:rgba(40,60,100,.75)}

  #lb .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:12vw;height:12vw;border-radius:50%;
    border:1px solid rgba(180,210,255,.22);
    background:rgba(18,26,44,.55);backdrop-filter:blur(8px);
    color:#dce8ff;font-size:7vw;line-height:1;
    display:flex;align-items:center;justify-content:center;
    z-index:3;cursor:pointer;user-select:none;
  }
  #lb .nav:active{background:rgba(40,60,100,.7)}
  #lb .prev{left:3vw}
  #lb .next{right:3vw}
  #lb .counter{
    position:absolute;left:0;right:0;bottom:8vw;text-align:center;
    font-size:3.4vw;letter-spacing:.3em;color:#9aa8c8;z-index:3;
  }
  #lb .counter small{
    display:block;margin-top:1.6vw;font-size:2.6vw;letter-spacing:.24em;color:#5d6784;
  }
</style>
</head>
<body>
  <a class="back" href="categories.html">← 返回</a>

  <header>
    <div class="dotline"><span class="dot"></span><span>Generated by DeepSeek</span></div>
    <h1><span class="hl">鬼针草</span></h1>
    <p class="sub">A collection of nine</p>
    <div class="count">共 9 张 · 点开可左右滑</div>
  </header>

  <div class="grid">
    <figure data-n="01"><img src="gallery/01.webp" alt=""></figure>
    <figure data-n="02"><img src="gallery/02.webp" alt=""></figure>
    <figure data-n="03"><img src="gallery/03.webp" alt=""></figure>
    <figure data-n="04"><img src="gallery/04.webp" alt=""></figure>
    <figure data-n="05"><img src="gallery/05.webp" alt=""></figure>
    <figure data-n="06"><img src="gallery/06.webp" alt=""></figure>
    <figure data-n="07"><img src="gallery/07.webp" alt=""></figure>
    <figure data-n="08"><img src="gallery/08.webp" alt=""></figure>
    <figure data-n="09"><img src="gallery/09.webp" alt=""></figure>
  </div>

  <footer>HOSHINO886 · 2026</footer>

  <div id="lb">
    <div class="stage"><img alt=""></div>
    <span class="close">×</span>
    <span class="nav prev">‹</span>
    <span class="nav next">›</span>
    <div class="counter"><span class="pos">1 / 9</span><small>左右滑动切换 · 点空白关闭</small></div>
  </div>

<script>
(function(){
  const lb = document.getElementById('lb');
  const stage = lb.querySelector('.stage');
  const lbImg = lb.querySelector('img');
  const pos = lb.querySelector('.pos');
  const thumbs = Array.prototype.slice.call(document.querySelectorAll('.grid img'));
  let idx = 0;

  function show(i){
    idx = (i + thumbs.length) % thumbs.length;
    lbImg.src = thumbs[idx].src;
    pos.textContent = (idx + 1) + ' / ' + thumbs.length;
    lbImg.style.animation = 'none';
    void lbImg.offsetWidth;
    lbImg.style.animation = '';
  }
  function open(i){ show(i); lb.classList.add('on'); document.body.classList.add('locked'); }
  function close(){ lb.classList.remove('on'); document.body.classList.remove('locked'); }

  thumbs.forEach(function(img, i){
    img.addEventListener('click', function(e){ e.preventDefault(); open(i); });
  });

  lb.querySelector('.close').addEventListener('click', function(e){ e.stopPropagation(); close(); });
  lb.querySelector('.prev').addEventListener('click', function(e){ e.stopPropagation(); show(idx - 1); });
  lb.querySelector('.next').addEventListener('click', function(e){ e.stopPropagation(); show(idx + 1); });

  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('on')) return;
    if (e.key === 'ArrowLeft') show(idx - 1);
    if (e.key === 'ArrowRight') show(idx + 1);
    if (e.key === 'Escape') close();
  });

  let sx = 0, sy = 0, moved = false;
  stage.addEventListener('touchstart', function(e){
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false;
  }, {passive:true});

  stage.addEventListener('touchmove', function(e){
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
  }, {passive:true});

  stage.addEventListener('touchend', function(e){
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
      show(idx + (dx < 0 ? 1 : -1));
    } else if (!moved && e.target === stage) {
      close();
    }
  }, {passive:true});

  stage.addEventListener('click', function(e){
    if (e.target === stage) close();
  });
})();
</script>
</body>
</html>
