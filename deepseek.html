<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Deepseek酱 · 暂无图片</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Deepseek酱 · 12 张">
<meta property="og:description" content="Deepseek酱生成 · Deepseek酱系列">
<meta property="og:image" content="https://hoshino886.github.io/poster/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0b0d14;color:#e8ecf5;
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    padding-bottom:14vw;
    background-image:radial-gradient(80% 40% at 50% -5%, rgba(90,140,255,.16), transparent 70%);
    background-repeat:no-repeat;
  }
  body.locked{overflow:hidden}

  .back{
    display:inline-flex;align-items:center;gap:2vw;
    position:absolute;top:5vw;left:5vw;z-index:10;
    padding:2.4vw 4.4vw;border-radius:99px;
    font-size:3.2vw;letter-spacing:.14em;text-decoration:none;color:#cfe0ff;
    background:rgba(15,22,38,.6);border:1px solid rgba(150,190,255,.22);
    backdrop-filter:blur(8px);
  }

  header{padding:11vw 6vw 8vw;text-align:center}
  .dotline{
    display:inline-flex;align-items:center;gap:2.2vw;
    font-size:3vw;letter-spacing:.32em;color:#6f7ea8;text-transform:uppercase;
    margin-bottom:5vw;
  }
  .dot{width:2vw;height:2vw;border-radius:50%;background:#6fd6ff;box-shadow:0 0 6vw rgba(111,214,255,.9);animation:pulse 2.2s infinite}
  @keyframes pulse{50%{opacity:.3}}
  h1{font-size:9.4vw;line-height:1.2;font-weight:800}
  h1 .hl{background:linear-gradient(180deg,#cdeeff,#63bbff 60%,#3d8ef0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:4vw;font-size:3.4vw;letter-spacing:.3em;color:#77839f;text-transform:uppercase}
  .count{margin-top:6vw;display:inline-block;font-size:3vw;letter-spacing:.22em;color:#8b97b8;border:1px solid rgba(140,170,230,.25);padding:2vw 5vw;border-radius:99px}

  .grid{column-count:2;column-gap:3.4vw;padding:0 4vw}
  figure{
    break-inside:avoid;margin:0 0 3.4vw;border-radius:3vw;overflow:hidden;
    background:#151b28;box-shadow:0 .8vw 4vw rgba(0,0,0,.45);position:relative;
    cursor:zoom-in;
  }
  figure img{display:block;width:100%;height:auto}
  figure::after{
    content:attr(data-n);position:absolute;right:2.6vw;bottom:2.4vw;
    font-size:2.8vw;letter-spacing:.14em;color:rgba(255,255,255,.72);
    text-shadow:0 .4vw 2vw rgba(0,0,0,.8);
  }

  .empty{margin:2vw 0 0;padding:16vw 6vw;text-align:center;border-radius:5vw;
    background:rgba(21,27,40,.72);border:1px dashed rgba(140,175,235,.28)}
  .empty .ico{font-size:13vw;line-height:1;margin-bottom:5vw;opacity:.85}
  .empty p{font-size:5.6vw;font-weight:800;letter-spacing:.08em}
  .empty small{display:block;margin-top:3.6vw;font-size:3vw;letter-spacing:.18em;color:#7d89a6}

  footer{margin-top:10vw;text-align:center;font-size:2.9vw;letter-spacing:.26em;color:#4f5872}

  /* 灯箱 */
  #lb{position:fixed;inset:0;z-index:50;display:none;background:#05070f}
  #lb.on{display:block}
  #lb .stage{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:5vw;overflow:hidden;
  }
  #lb img{
    max-width:100%;max-height:82vh;border-radius:2.5vw;
    box-shadow:0 2vw 12vw rgba(0,0,0,.85);
    animation:pop .2s ease;
    touch-action:none;
    -webkit-touch-callout:default;
    transform-origin:center center;
    will-change:transform;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0}}

  #lb .close,#lb .dl{
    position:absolute;top:4vw;z-index:3;
    width:11vw;height:11vw;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:6.5vw;line-height:1;color:#e7efff;text-decoration:none;
    border:1px solid rgba(180,210,255,.22);
    background:rgba(18,26,44,.6);backdrop-filter:blur(8px);
    cursor:pointer;
  }
  #lb .close{right:4vw}
  #lb .dl{right:17vw;font-size:5vw}
  #lb .close:active,#lb .dl:active{background:rgba(40,60,100,.75)}

  #lb .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:12vw;height:12vw;border-radius:50%;
    border:1px solid rgba(180,210,255,.22);
    background:rgba(18,26,44,.55);backdrop-filter:blur(8px);
    color:#dce8ff;font-size:7vw;line-height:1;
    display:flex;align-items:center;justify-content:center;
    z-index:3;cursor:pointer;user-select:none;
  }
  #lb .nav:active{background:rgba(40,60,100,.7)}
  #lb .prev{left:3vw}
  #lb .next{right:3vw}
  #lb .counter{
    position:absolute;left:0;right:0;bottom:8vw;text-align:center;
    font-size:3.4vw;letter-spacing:.3em;color:#9aa8c8;z-index:3;
  }
  #lb .counter small{
    display:block;margin-top:1.6vw;font-size:2.6vw;letter-spacing:.24em;color:#5d6784;
  }
</style>
<link rel="stylesheet" href="fx.css?v=14">
</head>
<body>
  <a class="back" href="categories.html">← 返回</a>

  <header>
    <div class="dotline"><span class="dot"></span><span>Generated by DeepSeek</span></div>
    <h1><span class="hl">Deepseek酱</span></h1>
    <p class="sub">Nothing here yet</p>
    <div class="count">共 0 张 · 暂无图片</div>
  </header>

  <div class="empty">
    <div class="ico">🐳</div>
    <p>暂无图片</p>
    <small>图片还在路上，过阵子再来看看</small>
  </div>

  <footer>HOSHINO886 · 2026</footer>

  <div id="lb">
    <div class="stage"><img alt=""></div>
    <a class="dl" download title="保存图片">↓</a>
    <span class="close">×</span>
    <span class="nav prev">‹</span>
    <span class="nav next">›</span>
    <div class="counter"><span class="pos">0 / 0</span><small>左右滑切换 · 双指放大 · 点 × 关闭</small></div>
  </div>

<script>
(function(){
  const lb = document.getElementById('lb');
  const stage = lb.querySelector('.stage');
  const lbImg = lb.querySelector('img');
  const pos = lb.querySelector('.pos');
  const dl = lb.querySelector('.dl');
  const thumbs = Array.prototype.slice.call(document.querySelectorAll('.grid img'));
  let idx = 0;
  let closedAt = 0;

  let scale = 1, tx = 0, ty = 0;
  let baseDist = 0, startScale = 1, dragging = false, dragX = 0, dragY = 0;

  function applyZoom(){
    lbImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }
  function resetZoom(){
    scale = 1; tx = 0; ty = 0;
    lbImg.style.transform = '';
  }
  function dist(t){
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function show(i){
    idx = (i + thumbs.length) % thumbs.length;
    resetZoom();
    lbImg.src = thumbs[idx].src;
    dl.href = thumbs[idx].src;
    pos.textContent = (idx + 1) + ' / ' + thumbs.length;
    lbImg.style.animation = 'none';
    void lbImg.offsetWidth;
    lbImg.style.animation = '';
    preload(idx);
  }

  function preload(i){
    [1, -1].forEach(function(d){
      const k = (i + d + thumbs.length) % thumbs.length;
      const im = new Image();
      im.src = thumbs[k].src;
    });
  }

  function open(i){ show(i); lb.classList.add('on'); document.body.classList.add('locked'); }
  function close(){ lb.classList.remove('on'); document.body.classList.remove('locked'); resetZoom(); closedAt = Date.now(); }

  thumbs.forEach(function(img, i){
    img.addEventListener('click', function(e){
      e.preventDefault();
      if (Date.now() - closedAt < 450) return;
      open(i);
    });
  });

  lb.querySelector('.close').addEventListener('click', function(e){ e.stopPropagation(); close(); });
  lb.querySelector('.prev').addEventListener('click', function(e){ e.stopPropagation(); if (scale <= 1.01) show(idx - 1); });
  lb.querySelector('.next').addEventListener('click', function(e){ e.stopPropagation(); if (scale <= 1.01) show(idx + 1); });

  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('on')) return;
    if (e.key === 'ArrowLeft') show(idx - 1);
    if (e.key === 'ArrowRight') show(idx + 1);
    if (e.key === 'Escape') close();
  });

  lbImg.addEventListener('dblclick', function(){
    if (scale > 1) { resetZoom(); } else { scale = 2.2; applyZoom(); }
  });

  let sx = 0, sy = 0, moved = false;

  stage.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) {
      baseDist = dist(e.touches);
      startScale = scale;
      moved = true;
      dragging = false;
    } else if (e.touches.length === 1) {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      moved = false;
      if (scale > 1.01) { dragging = true; dragX = sx; dragY = sy; }
    }
  }, {passive:true});

  stage.addEventListener('touchmove', function(e){
    if (e.touches.length === 2) {
      e.preventDefault();
      const d = dist(e.touches);
      if (baseDist > 0) {
        scale = Math.min(4, Math.max(0.7, startScale * d / baseDist));
        applyZoom();
      }
    } else if (e.touches.length === 1 && dragging) {
      e.preventDefault();
      tx += e.touches[0].clientX - dragX;
      ty += e.touches[0].clientY - dragY;
      dragX = e.touches[0].clientX; dragY = e.touches[0].clientY;
      applyZoom();
    } else if (e.touches.length === 1) {
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
    }
  }, {passive:false});

  stage.addEventListener('touchend', function(e){
    const zoomed = scale > 1.01;
    dragging = false;

    if (e.touches.length === 0) {
      if (!zoomed) resetZoom();
      const ct = e.changedTouches[0];
      const dx = (ct ? ct.clientX : sx) - sx;
      const dy = (ct ? ct.clientY : sy) - sy;
      if (!zoomed && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
        show(idx + (dx < 0 ? 1 : -1));
      }
    }
  }, {passive:true});
})();
</script>
<script src="fx.js?v=14"></script>
</body>
</html>
