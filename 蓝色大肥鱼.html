<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6cc0">
<title>大肥鱼 · 海报</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#03203c}
  body{display:grid;place-items:center;
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}

  .poster{
    container-type:size;
    position:relative;
    width:min(100vw, 56.25vh);
    aspect-ratio:9/16;
    overflow:hidden;
    isolation:isolate;
    display:flex;flex-direction:column;
    padding:7cqw 6cqw 6cqw;
    color:#fff;
    background:
      radial-gradient(60% 30% at 20% 0%, rgba(255,255,255,.35), transparent 60%),
      linear-gradient(180deg,#a6e2ff 0%,#5db8f5 28%,#1481d6 62%,#0a4a86 88%,#06325c 100%);
  }

  /* 气泡 */
  .bubble{
    position:absolute;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), rgba(255,255,255,.16) 55%, transparent 70%);
    border:1px solid rgba(255,255,255,.45);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(.9);opacity:0}
    12%{opacity:.85}
    85%{opacity:.5}
    100%{transform:translateY(-62cqw) scale(1.06);opacity:0}
  }

  /* 顶部抬头 */
  .top{
    position:relative;z-index:3;display:flex;align-items:center;gap:2.4cqw;
    font-size:2.3cqw;letter-spacing:.34em;color:rgba(255,255,255,.82);
    text-transform:uppercase;
  }
  .top::before{content:"";width:6cqw;height:1px;background:rgba(255,255,255,.7)}
  .top .sp{flex:1}

  /* 鱼 */
  .stage{position:relative;z-index:2;display:grid;place-items:center;margin:5cqw 0 2cqw}
  .fish{width:94%;display:block;animation:bob 4s ease-in-out infinite;
        filter:drop-shadow(0 3cqw 3cqw rgba(3,32,60,.35))}
  @keyframes bob{50%{transform:translateY(-2.2cqw) rotate(-1.2deg)}}

  /* 标题 */
  .title{position:relative;z-index:3;text-align:center;margin-top:auto}
  h1{
    font-size:23cqw;line-height:.95;font-weight:900;letter-spacing:.03em;
    color:#fff;
    text-shadow:0 1.5cqw 0 #0b4c86, 0 2.6cqw 4cqw rgba(2,30,58,.45);
  }
  h1 em{font-style:normal;display:inline-block;transform:rotate(-3deg)}
  .en{
    margin-top:2.6cqw;font-size:2.9cqw;letter-spacing:.42em;
    color:rgba(255,255,255,.78);text-transform:uppercase;
  }

  /* 一句话 */
  .quote{
    position:relative;z-index:3;margin-top:4.6cqw;
    text-align:center;font-size:3.4cqw;letter-spacing:.22em;color:#eaf7ff;
    font-weight:600;
  }
  .quote small{
    display:block;margin-top:1.6cqw;font-size:2.4cqw;font-weight:400;
    letter-spacing:.24em;color:rgba(255,255,255,.62);
  }

  /* 底部信息 */
  .foot{
    position:relative;z-index:3;margin-top:5.4cqw;
    display:flex;align-items:flex-end;justify-content:space-between;gap:3cqw;
    padding-top:3cqw;border-top:1px solid rgba(255,255,255,.35);
    font-size:2.4cqw;letter-spacing:.16em;color:rgba(255,255,255,.85);
  }
  .foot b{display:block;font-size:2.9cqw;font-weight:800;letter-spacing:.06em;color:#fff}
  .foot .r{text-align:right}

  /* 波浪 */
  .wave{position:absolute;left:0;right:0;bottom:0;z-index:2;width:100%;height:22cqw;pointer-events:none}
</style>
</head>
<body>
  <main class="poster">
    <div class="bubble" style="width:5cqw;height:5cqw;left:12%;bottom:38%;animation-duration:9s;animation-delay:.2s"></div>
    <div class="bubble" style="width:3.4cqw;height:3.4cqw;left:78%;bottom:32%;animation-duration:11s;animation-delay:1.4s"></div>
    <div class="bubble" style="width:2.4cqw;height:2.4cqw;left:88%;bottom:46%;animation-duration:8s;animation-delay:2.6s"></div>
    <div class="bubble" style="width:4.2cqw;height:4.2cqw;left:26%;bottom:26%;animation-duration:12s;animation-delay:4s"></div>

    <header class="top">
      <span>Blue · Fat · Fish</span>
      <span class="sp"></span>
      <span>No.01</span>
    </header>

    <section class="stage">
      <svg class="fish" viewBox="-14 0 330 230" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0" stop-color="#8fd8ff"/>
            <stop offset="45%" stop-color="#37a3f2"/>
            <stop offset="100%" stop-color="#0b5fae"/>
          </linearGradient>
          <radialGradient id="shine" cx="0.35" cy="0.28" r="0.55">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- 尾巴 -->
        <path d="M62 115 C30 92 12 78 -2 62 C-6 84 -6 146 -2 168 C14 152 32 138 62 118 Z"
              fill="#1d84dc"/>
        <path d="M62 115 C40 104 26 96 16 86 C14 104 14 126 16 144 C28 134 44 126 62 118 Z"
              fill="#4aa9ef" opacity=".85"/>

        <!-- 身体 -->
        <ellipse cx="162" cy="115" rx="103" ry="88" fill="url(#body)"/>
        <!-- 肚子 -->
        <ellipse cx="150" cy="142" rx="76" ry="52" fill="#cdeeff" opacity=".22"/>
        <!-- 高光 -->
        <ellipse cx="126" cy="74" rx="58" ry="40" fill="url(#shine)"/>

        <!-- 背鳍 -->
        <path d="M112 34 C132 4 176 2 196 26" fill="#2b95e8" stroke="#1d7ecf" stroke-width="2"/>

        <!-- 侧鳍 -->
        <path d="M132 132 C112 152 116 176 140 172 C154 168 160 150 152 138 Z"
              fill="#2b95e8" opacity=".95"/>

        <!-- 眼睛 -->
        <circle cx="222" cy="98" r="19" fill="#ffffff"/>
        <circle cx="228" cy="99" r="9.5" fill="#0a2a4a"/>
        <circle cx="231.5" cy="95" r="3.4" fill="#ffffff"/>

        <!-- 腮红 -->
        <ellipse cx="212" cy="140" rx="11" ry="7" fill="#ff9db1" opacity=".62"/>

        <!-- 嘴 -->
        <path d="M232 136 q11 9 20 1" fill="none" stroke="#0a2a4a" stroke-width="3.4"
              stroke-linecap="round"/>

        <!-- 小斑点 -->
        <circle cx="96" cy="96" r="3" fill="#ffffff" opacity=".5"/>
        <circle cx="110" cy="120" r="2" fill="#ffffff" opacity=".4"/>
        <circle cx="88" cy="130" r="2.4" fill="#ffffff" opacity=".35"/>
      </svg>
    </section>

    <div class="title">
      <h1><em>大肥鱼</em></h1>
      <p class="en">The Big Fat Blue Fish</p>
      <p class="quote">胖，是福气在膨胀。
        <small>SWIM SLOW · LIVE FULL</small>
      </p>
    </div>

    <div class="foot">
      <div><b>BLUE FISH EXPO</b>2026 · 深海特别展</div>
      <div class="r"><b>10.31</b>海洋馆 B1</div>
    </div>

    <svg class="wave" viewBox="0 0 360 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 58 C60 30 120 86 180 58 C240 30 300 86 360 58 L360 120 L0 120 Z"
            fill="#ffffff" opacity=".14"/>
      <path d="M0 78 C60 52 120 104 180 78 C240 52 300 104 360 78 L360 120 L0 120 Z"
            fill="#ffffff" opacity=".10"/>
    </svg>
  </main>
</body>
</html>
