<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050607">
<title>DSH · 海报</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000}
  body{display:grid;place-items:center;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono","PingFang SC",monospace}

  .poster{
    container-type:size;
    position:relative;
    width:min(100vw, 56.25vh);
    aspect-ratio:9/16;
    overflow:hidden;
    isolation:isolate;
    display:flex;flex-direction:column;
    padding:7cqw 7cqw 6cqw;
    color:#e8f5ef;
    background:
      radial-gradient(70% 45% at 85% 8%, rgba(0,229,160,.10), transparent 65%),
      radial-gradient(60% 40% at 8% 92%, rgba(0,229,160,.07), transparent 60%),
      #050607;
  }

  /* 网格 */
  .grid{
    position:absolute;inset:0;z-index:0;opacity:.35;
    background-image:radial-gradient(rgba(0,229,160,.16) 1px, transparent 1px);
    background-size:6cqw 6cqw;
    -webkit-mask-image:radial-gradient(85% 65% at 50% 40%, #000 10%, transparent 80%);
            mask-image:radial-gradient(85% 65% at 50% 40%, #000 10%, transparent 80%);
  }
  /* 扫描线 */
  .scan{
    position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
  }
  /* 顶部状态条 */
  header{
    position:relative;z-index:2;
    display:flex;align-items:center;gap:2.4cqw;
    font-size:2.3cqw;letter-spacing:.22em;color:#5f7a70;text-transform:uppercase;
    padding-bottom:3.4cqw;border-bottom:1px solid rgba(0,229,160,.22);
  }
  .dot{width:1.5cqw;height:1.5cqw;border-radius:50%;background:#00e5a0;
       box-shadow:0 0 2.4cqw rgba(0,229,160,.9);animation:pulse 2.4s infinite}
  .spacer{flex:1}
  @keyframes pulse{50%{opacity:.25}}

  /* 主标题 */
  .hero{position:relative;z-index:2;margin-top:auto;margin-bottom:auto}
  .prompt{
    font-size:3.2cqw;color:#00e5a0;letter-spacing:.1em;margin-bottom:3cqw;
    display:flex;align-items:center;gap:2cqw;
  }
  .prompt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(0,229,160,.55),transparent)}
  h1{
    font-size:15.5cqw;line-height:.92;font-weight:800;letter-spacing:-.01em;
    color:#f2fbf7;
  }
  h1 span{
    display:block;color:transparent;
    -webkit-text-stroke:1px rgba(0,229,160,.75);
  }
  .tag{
    margin-top:4.4cqw;font-size:3.3cqw;letter-spacing:.28em;color:#7fa79a;
  }

  /* 规格表 */
  .spec{
    position:relative;z-index:2;
    border-top:1px solid rgba(0,229,160,.22);
    padding-top:3.4cqw;display:grid;gap:1.9cqw;
    font-size:2.45cqw;letter-spacing:.06em;
  }
  .spec div{display:flex;justify-content:space-between;gap:3cqw}
  .spec dt{color:#587068;text-transform:uppercase;letter-spacing:.2em}
  .spec dd{color:#cfe8dd;text-align:right}

  /* 底部 */
  footer{
    position:relative;z-index:2;margin-top:4.6cqw;
    display:flex;align-items:flex-end;justify-content:space-between;gap:3cqw;
  }
  .quote{font-size:2.7cqw;line-height:1.9;color:#00e5a0;letter-spacing:.08em}
  .quote small{display:block;color:#587068;font-size:2.2cqw;letter-spacing:.2em;margin-top:.8cqw}
  .cursor{
    font-size:4.6cqw;color:#00e5a0;line-height:1;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* 角标 */
  .corner{position:absolute;width:5cqw;height:5cqw;border:1px solid rgba(0,229,160,.45);z-index:2}
  .corner.tl{top:3.2cqw;left:3.2cqw;border-right:0;border-bottom:0}
  .corner.br{bottom:3.2cqw;right:3.2cqw;border-left:0;border-top:0}
</style>
</head>
<body>
  <main class="poster">
    <div class="grid"></div>
    <div class="corner tl"></div>
    <div class="corner br"></div>

    <header>
      <span class="dot"></span>
      <span>DSH · Terminal</span>
      <span class="spacer"></span>
      <span>v4.1</span>
    </header>

    <section class="hero">
      <p class="prompt">$ whoami</p>
      <h1>DEEPSEEK<span>HARNESS</span></h1>
      <p class="tag">常驻在你手机里的 agent</p>
    </section>

    <section class="spec">
      <div><dt>model</dt><dd>deepseek-flash · 1017</dd></div>
      <div><dt>host</dt><dd>dsh · android</dd></div>
      <div><dt>tools</dt><dd>shell · file · web</dd></div>
      <div><dt>lang</dt><dd>中文 / English</dd></div>
    </section>

    <footer>
      <p class="quote">能做的说能做，<br>不能做的直说。
        <small>— 这是我的原则</small>
      </p>
      <span class="cursor">▌</span>
    </footer>

    <div class="scan"></div>
  </main>
</body>
</html>
