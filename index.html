<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Deepseek酱生成</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05070f}
  body{
    display:grid;place-items:center;
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  }

  .cover{
    container-type:size;
    position:relative;
    width:min(100vw, 56.25vh);
    aspect-ratio:9/16;
    overflow:hidden;
    isolation:isolate;
    background:#05070f;
  }

  .cover img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 18%;
    animation:zoom 22s ease-in-out infinite alternate;
  }
  @keyframes zoom{
    from{transform:scale(1)}
    to{transform:scale(1.06)}
  }

  .shade{
    position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(180deg, rgba(5,7,15,.45) 0%, transparent 26%),
      linear-gradient(0deg, rgba(5,7,15,.94) 0%, rgba(5,7,15,.72) 22%, transparent 58%);
  }

  .top{
    position:absolute;z-index:2;top:6cqw;left:6cqw;right:6cqw;
    display:flex;align-items:center;gap:2.4cqw;
    font-size:2.2cqw;letter-spacing:.34em;color:rgba(220,235,255,.72);
    text-transform:uppercase;
  }
  .dot{
    width:1.4cqw;height:1.4cqw;border-radius:50%;
    background:#6fd6ff;box-shadow:0 0 2.6cqw rgba(111,214,255,.95);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{50%{opacity:.3}}

  .bottom{
    position:absolute;z-index:2;left:0;right:0;bottom:0;
    padding:0 7cqw 8cqw;
    text-align:center;
  }

  h1{
    font-size:11.5cqw;line-height:1.16;font-weight:800;
    letter-spacing:.02em;color:#fff;
    text-shadow:0 .6cqw 2.4cqw rgba(0,20,50,.75);
  }
  h1 .hl{
    background:linear-gradient(180deg,#bfe9ff,#5fb8ff 62%,#3d8ef0);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    -webkit-text-stroke:.35cqw rgba(255,255,255,.25);
  }

  .sub{
    margin-top:2.6cqw;font-size:2.5cqw;letter-spacing:.34em;
    color:rgba(210,228,255,.66);text-transform:uppercase;
  }

  .enter{
    display:inline-flex;align-items:center;justify-content:center;gap:2.2cqw;
    margin-top:6.4cqw;
    padding:3.4cqw 9.5cqw;
    border-radius:99px;
    font-size:3.6cqw;font-weight:700;letter-spacing:.24em;
    text-decoration:none;
    color:#06152b;
    background:linear-gradient(180deg,#ffffff,#cfe9ff);
    box-shadow:
      0 1.2cqw 3.6cqw rgba(90,180,255,.45),
      0 0 0 .35cqw rgba(255,255,255,.16),
      inset 0 -.6cqw 1.4cqw rgba(120,180,255,.35);
    animation:breathe 2.8s ease-in-out infinite;
    transition:transform .18s ease;
  }
  .enter:active{transform:scale(.96)}
  @keyframes breathe{
    0%,100%{box-shadow:0 1.2cqw 3.6cqw rgba(90,180,255,.40),0 0 0 .35cqw rgba(255,255,255,.14),inset 0 -.6cqw 1.4cqw rgba(120,180,255,.35)}
    50%{box-shadow:0 1.6cqw 5.2cqw rgba(120,200,255,.72),0 0 0 .35cqw rgba(255,255,255,.26),inset 0 -.6cqw 1.4cqw rgba(120,180,255,.35)}
  }
  .enter .arw{font-size:3.2cqw;transform:translateY(-.2cqw)}

  .foot{
    margin-top:5.4cqw;font-size:2.1cqw;letter-spacing:.26em;
    color:rgba(160,185,220,.5);
  }
</style>
</head>
<body>
  <main class="cover">
    <img src="cover.jpg" alt="封面">
    <div class="shade"></div>

    <div class="top">
      <span class="dot"></span>
      <span>Generated by DeepSeek</span>
    </div>

    <div class="bottom">
      <h1><span class="hl">Deepseek酱</span>生成</h1>
      <p class="sub">A tiny gallery, made with AI</p>

      <a class="enter" href="categories.html">
        点击进入<span class="arw">→</span>
      </a>

      <p class="foot">HOSHINO886 · 2026</p>
    </div>
  </main>
</body>
</html>
