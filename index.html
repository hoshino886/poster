<!-- 图标 -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05070f}
  body{
    display:grid;place-items:center;
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  }

  .cover{
    container-type:size;
    position:relative;
    width:min(100vw, 56.25vh);
    aspect-ratio:9/16;
    overflow:hidden;
    isolation:isolate;
    background:#05070f;
  }

  .cover .pic{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 18%;
    animation:zoom 22s ease-in-out infinite alternate;
    -webkit-touch-callout:default;
    cursor:pointer;
  }
  @keyframes zoom{
    from{transform:scale(1)}
    to{transform:scale(1.06)}
  }

  .shade{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(180deg, rgba(5,7,15,.45) 0%, transparent 26%),
      linear-gradient(0deg, rgba(5,7,15,.94) 0%, rgba(5,7,15,.72) 22%, transparent 58%);
  }

  .top{
    position:absolute;z-index:2;top:6cqw;left:6cqw;right:6cqw;
    display:flex;align-items:center;gap:2.4cqw;
    font-size:2.2cqw;letter-spacing:.34em;color:rgba(220,235,255,.72);
    text-transform:uppercase;
  }
  .dot{
    width:1.4cqw;height:1.4cqw;border-radius:50%;
    background:#6fd6ff;box-shadow:0 0 2.6cqw rgba(111,214,255,.95);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{50%{opacity:.3}}

  .bottom{
    position:absolute;z-index:2;left:0;right:0;bottom:0;
    padding:0 7cqw 8cqw;
    text-align:center;
  }

  h1{
    font-size:11.5cqw;line-height:1.16;font-weight:800;
    letter-spacing:.02em;color:#fff;
    text-shadow:0 .6cqw 2.4cqw rgba(0,20,50,.75);
  }
  h1 .hl{
    background:linear-gradient(180deg,#bfe9ff,#5fb8ff 62%,#3d8ef0);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    -webkit-text-stroke:.35cqw rgba(255,255,255,.25);
  }

  .sub{
    margin-top:2.6cqw;font-size:2.5cqw;letter-spacing:.34em;
    color:rgba(210,228,255,.66);text-transform:uppercase;
  }

  .enter{
    display:inline-flex;align-items:center;justify-content:center;gap:2.2cqw;
    margin-top:6.4cqw;
    padding:3.4cqw 9.5cqw;
    border-radius:99px;
    font-size:3.6cqw;font-weight:700;letter-spacing:.24em;
    text-decoration:none;
    color:#06152b;
    background:linear-gradient(180deg,#ffffff,#cfe9ff);
    box-shadow:
      0 1.2cqw 3.6cqw rgba(90,180,255,.45),
      0 0 0 .35cqw rgba(255,255,255,.16),
      inset 0 -.6cqw 1.4cqw rgba(120,180,255,.35);
    animation:breathe 2.8s ease-in-out infinite;
    transition:transform .18s ease;
  }
  .enter:active{transform:scale(.96)}
  @keyframes breathe{
    0%,100%{box-shadow:0 1.2cqw 3.6cqw rgba(90,180,255,.40),0 0 0 .35cqw rgba(255,255,255,.14),inset 0 -.6cqw 1.4cqw rgba(120,180,255,.35)}
    50%{box-shadow:0 1.6cqw 5.2cqw rgba(120,200,255,.72),0 0 0 .35cqw rgba(255,255,255,.26),inset 0 -.6cqw 1.4cqw rgba(120,180,255,.35)}
  }
  .enter .arw{font-size:3.2cqw;transform:translateY(-.2cqw)}

  .foot{
    margin-top:5.4cqw;font-size:2.1cqw;letter-spacing:.26em;
    color:rgba(160,185,220,.5);
  }

  /* 彩蛋 */
  .egg{position:fixed;inset:0;z-index:99;pointer-events:none;overflow:hidden}
  .egg i{
    position:absolute;bottom:-60px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(150,205,255,.35) 58%, rgba(150,205,255,.06));
    border:1px solid rgba(205,232,255,.55);
    animation:rise 3.6s ease-in forwards;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(.7);opacity:0}
    12%{opacity:.9}
    100%{transform:translateY(-115vh) scale(1.1);opacity:0}
  }
  .egg-msg{
    position:absolute;left:0;right:0;bottom:34%;text-align:center;
    font-size:6.4vw;font-weight:800;letter-spacing:.06em;
    color:#e2f4ff;text-shadow:0 0 5vw rgba(90,180,255,.95);
    animation:eggFade 3.6s ease forwards;
  }
  @keyframes eggFade{
    0%{opacity:0;transform:translateY(3vw) scale(.96)}
    18%{opacity:1;transform:translateY(0) scale(1)}
    75%{opacity:1}
    100%{opacity:0;transform:translateY(-2vw) scale(1.02)}
  }
</style>
<link rel="stylesheet" href="fx.css?v=3">
</head>
<body>
  <main class="cover">
    <img class="pic" src="cover.jpg" alt="封面">
    <div class="shade"></div>

    <div class="top">
      <span class="dot"></span>
      <span>Generated by DeepSeek</span>
    </div>

    <div class="bottom">
      <h1><span class="hl">Deepseek酱</span>生成</h1>
      <p class="sub">A tiny gallery, made with AI</p>

      <a class="enter" href="categories.html">
        点击进入<span class="arw">→</span>
      </a>

      <p class="foot">HOSHINO886 · 2026</p>
    </div>
  </main>

<script>
(function(){
  const pic = document.querySelector('.pic');
  let taps = 0, timer = null;

  pic.addEventListener('click', function(){
    taps++;
    clearTimeout(timer);
    timer = setTimeout(function(){ taps = 0; }, 1400);
    if (taps >= 5) { taps = 0; egg(); }
  });

  function egg(){
    if (document.querySelector('.egg')) return;
    const layer = document.createElement('div');
    layer.className = 'egg';

    for (let i = 0; i < 18; i++) {
      const b = document.createElement('i');
      const size = 8 + Math.random() * 26;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = (Math.random() * 100) + '%';
      b.style.animationDelay = (Math.random() * 1.4) + 's';
      b.style.animationDuration = (2.8 + Math.random() * 1.6) + 's';
      layer.appendChild(b);
    }

    const msg = document.createElement('div');
    msg.className = 'egg-msg';
    msg.textContent = '咕噜咕噜 🐳';
    layer.appendChild(msg);

    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 5600);
  }
})();
</script>
<script src="fx.js?v=3"></script>
</body>
</html>
